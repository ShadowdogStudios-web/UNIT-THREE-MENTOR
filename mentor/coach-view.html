h": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The Reformers"}, {"t": 3, "say": "Agitators and builders: Debs, Altgeld, Burnham, Sullivan — and Waukegan.", "ask": "Why might a governor pardoning the Haymarket men be called brave?", "ans": "It ended his political career; it was unpopular.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The Agitators & the Builders"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: weigh both sides of one person (Pullman).", "ask": "Was Pullman a builder, a boss, or both?", "ans": "Both: clean model town and total control plus wage cuts.", "watch": "One-sided answers.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Builder, boss, or both?"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: claim + evidence about one figure.", "ask": "Who moved Illinois most?", "ans": "Any figure with two pieces of evidence.", "watch": "Students pick a figure and give only praise.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Who moved Illinois most?"}, {"t": 8, "say": "Build a Deeper Claim: claim, evidence, reasoning, counter-claim. Model a weak claim and fix it out loud before releasing: 'The age was bad' → 'The age showed ___, because ___.'", "ask": "Is your claim something a reasonable person could disagree with?", "ans": "A claim that takes a side and can be argued, backed by evidence from the slides.", "watch": "Claims that are just facts ('The fair was in 1893'). A fact can't be argued.", "move": "Honors must complete the counter-claim box. Others: claim + one piece of evidence is the minimum.", "title": "Who made the age?"}, {"t": 1, "say": "Go deeper. Students who finish early can open another deep dive or a film.", "ask": "", "ans": "", "watch": "Students leave without saving. Work autosaves, but remind them to Download my work if they switch devices.", "move": "", "title": "Go deeper"}]}, "three-nations/index.html": {"title": "Three Nations, One Frontier", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. The West from three points of view: the U.S., Mexico, and Native nations.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "Three Nations, One Frontier"}, {"t": 1, "say": "Three ideas to follow. Have students copy the three words into My Notes as headings.", "ask": "", "ans": "", "watch": "", "move": "These three headings become their notes for the whole deep dive.", "title": "Three ideas to follow"}, {"t": 2, "say": "Read one event from more than one side.", "ask": "What question is this deep dive asking you to answer?", "ans": "Restate the question in their own words.", "watch": "Students skip the framing slide.", "move": "Point out the skill: this is what they'll be graded on in the claim.", "title": "One place. Three points of view."}, {"t": 3, "say": "1848: the border moved, not the people. Mexicans in the Southwest became U.S. residents overnight.", "ask": "What does 'the border moved, not the people' mean?", "ans": "People stayed in their homes; the country they lived in changed.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The border moved, not the people"}, {"t": 3, "say": "The Plains nations: railroads, buffalo slaughter, reservations, the Army.", "ask": "Why did killing the buffalo matter so much?", "ans": "Plains nations depended on buffalo for food, shelter, and trade.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The nations of the Plains and the closing frontier"}, {"t": 3, "say": "One West, three stories: the cowboy comes from the Mexican vaquero.", "ask": "Where does the word 'buckaroo' come from?", "ans": "Vaquero — Spanish for cowboy.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "One West, three stories"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: point of view of two sources about the same land.", "ask": "Whose land was it?", "ans": "Depends on the source — treaty vs. Native or Mexican view; students explain each.", "watch": "Students pick one 'true' source.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Whose land was it?"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: test a famous claim (Turner's 'closed' frontier).", "ask": "Closed for whom?", "ans": "Closed for white settlers; for Native nations it was conquered, not empty.", "watch": "Students accept Turner without question.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "The frontier “closed” — for whom?"}, {"t": 8, "say": "Build a Deeper Claim: claim, evidence, reasoning, counter-claim. Model a weak claim and fix it out loud before releasing: 'The frontier was bad' → 'The frontier showed ___, because ___.'", "ask": "Is your claim something a reasonable person could disagree with?", "ans": "A claim that takes a side and can be argued, backed by evidence from the slides.", "watch": "Claims that are just facts ('The fair was in 1893'). A fact can't be argued.", "move": "Honors must complete the counter-claim box. Others: claim + one piece of evidence is the minimum.", "title": "What does the West prove?"}, {"t": 1, "say": "Go deeper. Students who finish early can open another deep dive or a film.", "ask": "", "ans": "", "watch": "Students leave without saving. Work autosaves, but remind them to Download my work if they switch devices.", "move": "", "title": "Go deeper"}]}, "wild-west/index.html": {"title": "The Wild West: Fencing the Frontier", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Barbed wire, Chicago's stockyards, and the gunfighter myth.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "The Wild West: Fencing the Frontier"}, {"t": 1, "say": "Three ideas to follow. Have students copy the three words into My Notes as headings.", "ask": "", "ans": "", "watch": "", "move": "These three headings become their notes for the whole deep dive.", "title": "Three ideas to follow"}, {"t": 2, "say": "Hold the exciting legend next to the dull paperwork.", "ask": "What question is this deep dive asking you to answer?", "ans": "Restate the question in their own words.", "watch": "Students skip the framing slide.", "move": "Point out the skill: this is what they'll be graded on in the claim.", "title": "Separate the myth from the record."}, {"t": 3, "say": "Barbed wire, DeKalb, Illinois, 1874 — Joseph Glidden's patent fenced the open range.", "ask": "How could a fence end the cattle drive?", "ans": "It closed the open range so herds couldn't cross freely.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The wire that fenced the West"}, {"t": 3, "say": "The animals came to Chicago: Union Stock Yards, Armour and Swift, refrigerator cars.", "ask": "Why drive cattle a thousand miles north?", "ans": "Chicago had the railroads and the packinghouses — that's where the money was.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The animals came to Chicago"}, {"t": 3, "say": "The gunfighter myth: Wyatt Earp, born in Monmouth, Illinois; dime novels made the legend.", "ask": "Why would dime novels exaggerate the West?", "ans": "Excitement sold copies.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The gunfighter myth"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: sourcing — made to sell vs. made to record.", "ask": "Which source should a historian trust more, and for what?", "ans": "The record for facts; the dime novel for what people wanted to believe.", "watch": "Students call the dime novel 'fake' and stop. It's evidence of the myth.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Myth vs. record"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: weigh two explanations.", "ask": "Who really tamed the West?", "ans": "Wire, railroads, and markets more than gunfighters.", "watch": "One-word answers.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Who really tamed the West?"}, {"t": 8, "say": "Build a Deeper Claim: claim, evidence, reasoning, counter-claim. Model a weak claim and fix it out loud before releasing: 'The West was bad' → 'The West showed ___, because ___.'", "ask": "Is your claim something a reasonable person could disagree with?", "ans": "A claim that takes a side and can be argued, backed by evidence from the slides.", "watch": "Claims that are just facts ('The fair was in 1893'). A fact can't be argued.", "move": "Honors must complete the counter-claim box. Others: claim + one piece of evidence is the minimum.", "title": "What really won the West?"}, {"t": 1, "say": "Go deeper. Students who finish early can open another deep dive or a film.", "ask": "", "ans": "", "watch": "Students leave without saving. Work autosaves, but remind them to Download my work if they switch devices.", "move": "", "title": "Go deeper"}]}, "joplin/index.html": {"title": "Ragtime: Scott Joplin", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Scott Joplin and ragtime. Have headphones ready.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "Ragtime: Scott Joplin"}, {"t": 3, "say": "Born around 1868 in northeast Texas into a family that included formerly enslaved people.", "ask": "What did Joplin have to overcome to become a musician?", "ans": "Poverty, racism, little access to formal training.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A pianist from the borderlands"}, {"t": 3, "say": "Sedalia, Missouri: a railroad town with music.", "ask": "Why would a railroad town have music?", "ans": "Workers with paychecks, clubs, travelers.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A railroad town with music in it"}, {"t": 3, "say": "What makes ragtime: steady left hand, syncopated right hand.", "ask": "Tap the beat on your desk while the music plays — where does the melody land?", "ans": "Just off the beat — that's syncopation.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "What makes it ragtime?"}, {"t": 6, "say": "Listening slide. Play the Maple Leaf Rag (1916 piano roll, played by Joplin himself). Students listen once just to enjoy, then again with the question.", "ask": "What do you notice about the rhythm?", "ans": "Bouncy, off-beat melody over a steady beat.", "watch": "Audio needs headphones or the room speaker. Test it before class.", "move": "Have students tap the left-hand beat.", "title": "Four rags by Scott Joplin"}, {"t": 3, "say": "Selling music by the page: sheet music was the product before records and radio.", "ask": "Why did publishers put bright covers on sheet music?", "ans": "To sell it — covers were advertising.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Selling music by the page"}, {"t": 3, "say": "'Never right to play ragtime fast' — Joplin's School of Ragtime, 1908.", "ask": "Why did Joplin want ragtime taken seriously?", "ans": "He saw it as serious music, not cheap noise.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "“Never right to play ragtime fast”"}, {"t": 3, "say": "From Missouri to the world, through railroads and the 1893 fair.", "ask": "How did ragtime spread?", "ans": "Railroads, sheet music, touring pianists, the World's Fair.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "From Missouri to the world"}, {"t": 3, "say": "St. Louis and 'The Cascades,' written for the 1904 World's Fair.", "ask": "What does writing music for a World's Fair tell you about Joplin's ambitions?", "ans": "He wanted a big, public, respected audience.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A home on Delmar, and “The Cascades”"}, {"t": 3, "say": "Treemonisha: an opera he couldn't get staged.", "ask": "Why couldn't a famous composer get his opera performed?", "ans": "Racism; Black composers weren't taken seriously in 'high' music.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "An opera called Treemonisha"}, {"t": 3, "say": "A late encore: rediscovered in the 1970s; Pulitzer Prize in 1976.", "ask": "Why might it take 60 years to honor him?", "ans": "The country's attitudes toward Black artists changed slowly.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A late encore"}, {"t": 5, "say": "Why did it take so long? Connect to Chapter 10's nadir.", "ask": "How does Joplin's life connect to what we learned about the nadir?", "ans": "Jim Crow limited what Black artists were allowed to do and be credited for.", "watch": "Students miss the connection to Chapter 10.", "move": "Sentence starter on the slide.", "title": "Why did it take so long?"}, {"t": 1, "say": "Your assignment: Listen Like a Historian. It opens on its own page.", "ask": "", "ans": "", "watch": "", "move": "", "title": "Your assignment"}]}, "waukegan-stage/index.html": {"title": "Waukegan on Stage", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Our own town in the industrial age. Students may know these places.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "Waukegan on Stage"}, {"t": 3, "say": "Waukegan around 1900: a factory town on the lake, 40 miles north of Chicago.", "ask": "What would bring workers to Waukegan?", "ans": "Factories, the railroad, the lake.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A factory town on the lake"}, {"t": 3, "say": "The wire mill: Washburn & Moen, later U.S. Steel & Wire.", "ask": "Where else in this unit did we see wire?", "ans": "Barbed wire fencing the West (Wild West deep dive).", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Wire for a nation"}, {"t": 3, "say": "Saturday night at the theater: vaudeville.", "ask": "What was vaudeville like?", "ans": "A lineup of short acts — singers, comedians, acrobats.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Saturday night at the theater"}, {"t": 3, "say": "Benjamin Kubelsky and his violin — Jack Benny's start in Waukegan.", "ask": "Why would his parents want him to be a violinist, not a comedian?", "ans": "Respectable career; immigrant hopes for their children.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Benjamin Kubelsky and his violin"}, {"t": 3, "say": "Becoming Jack Benny — one of the most famous comedians in America.", "ask": "What made audiences laugh more than his violin?", "ans": "His jokes and timing.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Becoming Jack Benny"}, {"t": 3, "say": "The Genesee Theatre, 1927.", "ask": "Has anyone been to the Genesee? What's it like?", "ans": "Personal answers — great hook.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The Genesee Theatre"}, {"t": 3, "say": "Ray Bradbury's hometown: 'Green Town' in his books is Waukegan.", "ask": "Why would a writer turn his hometown into fiction?", "ans": "Memory, love of place, it shaped him.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Ray Bradbury's hometown"}, {"t": 5, "say": "Why does local history matter? Students pick one part of Waukegan's story and connect it to a unit theme.", "ask": "How does Waukegan's story connect to industry, immigration, or entertainment?", "ans": "Wire mill = industry; Kubelsky family = immigration; vaudeville and the Genesee = entertainment.", "watch": "Students write about Waukegan today instead of the past.", "move": "Starter on the slide.", "title": "Why does local history matter?"}, {"t": 1, "say": "Your assignment: Our Town in the Industrial Age. It opens on its own page.", "ask": "", "ans": "", "watch": "", "move": "", "title": "Your assignment"}]}, "nickelodeon/index.html": {"title": "The Nickelodeon", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. A 1909 storefront theater. Have headphones and the projector ready.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "The Nickelodeon"}, {"t": 3, "say": "Kinetoscope parlors, 1894: movies in a box, one viewer at a time.", "ask": "How was watching a Kinetoscope different from a theater?", "ans": "One person, peeking into a box, no screen.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Movies in a box"}, {"t": 3, "say": "Play Sandow (1894). It's short and has no story.", "ask": "What's missing that every movie has today?", "ans": "A story, sound, editing, camera movement.", "watch": "Students laugh. That's fine — then ask why people paid for it.", "move": "Video slide — test playback before class.", "title": "Sandow, the Modern Hercules"}, {"t": 3, "say": "Projectors put movies on a screen; films were one act on a vaudeville bill.", "ask": "Why was a big screen a big change?", "ans": "Everyone could watch together — it became a shared event.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The movies move to the stage"}, {"t": 5, "say": "Play The Great Train Robbery excerpt. It told a story by cutting between scenes.", "ask": "How does this film tell a story differently from Sandow?", "ans": "It cuts between places, has characters, action, a plot.", "watch": "Students talk over it. Set a 'watch first, talk after' rule.", "move": "Video slide — test playback.", "title": "The Great Train Robbery"}, {"t": 3, "say": "The nickelodeon boom: empty stores, wooden chairs, a piano, five cents.", "ask": "Why was a nickel price so important?", "ans": "Working people could afford it.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The nickelodeon boom"}, {"t": 3, "say": "Who bought tickets: working people, immigrants, children.", "ask": "Why were silent films good for immigrant audiences?", "ans": "No language barrier — you didn't need English.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Who bought the tickets?"}, {"t": 3, "say": "Made in Chicago: Selig and Essanay.", "ask": "Were movies always made in Hollywood?", "ans": "No — Chicago was a major movie city first.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Made in Chicago"}, {"t": 4, "say": "His New Job (1915): Chaplin's first Essanay film, shot on Argyle Street in Chicago.", "ask": "What's funny about a movie about making movies?", "ans": "Chaos behind the scenes, Chaplin wrecking the set.", "watch": "Playing the whole film takes 20 minutes. Use the excerpt here; the full film is in the Film Theater.", "move": "Video slide.", "title": "His New Job"}, {"t": 3, "say": "Chicago's 1907 censorship law — the first in the country.", "ask": "Why did reformers want to censor movies?", "ans": "They feared crime films would teach bad behavior to young people.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Chicago's censorship law"}, {"t": 3, "say": "Telling their own stories: Black filmmakers like William Foster pushed back on racist films.", "ask": "Why would Black filmmakers make their own movies?", "ans": "To show real Black life instead of stereotypes.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Telling their own stories"}, {"t": 3, "say": "Waukegan at the movies: small theaters, then the Genesee in 1927.", "ask": "How did Waukegan's movie houses change?", "ans": "From small storefronts to a grand movie palace.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Waukegan at the movies"}, {"t": 3, "say": "Why the movies left for Hollywood: weather, landscapes, cheap land.", "ask": "Why couldn't Chicago compete?", "ans": "Winter weather; California had sun year-round.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Why the movies left for Hollywood"}, {"t": 5, "say": "Entertainment or danger? Was Chicago right to censor movies?", "ask": "Was Chicago right to censor movies in 1907?", "ans": "Either side, with a reason from the slides.", "watch": "Students argue about today's movies instead of 1907.", "move": "Starter on the slide; connect to Chapter 7's 'justice or order.'", "title": "Entertainment, or danger?"}, {"t": 1, "say": "Your assignment: Opening Night at the Nickelodeon.", "ask": "", "ans": "", "watch": "", "move": "", "title": "Your assignment"}]}, "barbershop/index.html": {"title": "Barbershop Harmony", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Barbershop harmony and its Black roots. Have headphones ready.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "Barbershop Harmony"}, {"t": 3, "say": "Four voices: lead, tenor, bass, baritone.", "ask": "Which voice sings the melody?", "ans": "The lead.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Four voices, one chord"}, {"t": 3, "say": "Harmony in Black barbershops of the 1880s–90s.", "ask": "Why would a barbershop be a place for music?", "ans": "Men waited together, talked, sang; barbers often played instruments.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Harmony in the barbershop"}, {"t": 3, "say": "Bert Williams: one of the most famous Black entertainers in America.", "ask": "What made Williams's success remarkable?", "ans": "He became a star in a time of Jim Crow.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "Bert Williams"}, {"t": 4, "say": "Play 'Play That Barber Shop Chord' (1910).", "ask": "What does the singer keep a
