<script>var D={"chapter1.html": {"title": "Chapter 1: The Gilded Age: Wealth and Its Cost", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Point to the word 'gilded': 'Something gilded is covered in a thin layer of gold. Keep that picture in your head all period.'", "ask": "What's the difference between something that's gold and something that's gilded?", "ans": "Gold is gold all the way through; gilded is only gold on the outside — cheap or broken underneath.", "watch": "Students hear 'golden age' and assume the chapter will be a celebration.", "move": "Draw a quick box on the board: thin gold line on top, a different color underneath. Label it as you go.", "title": "The Gilded Age: Wealth and Its Cost"}, {"t": 3, "say": "Read the first paragraph aloud slowly — the breaker boy is the hook. Pause after 'ten hours.'", "ask": "How old is this boy? What would you be doing at that age, at that hour?", "ans": "He's twelve; at twelve they'd be in school, asleep, playing — not sorting coal for ten hours.", "watch": "Students treat it as a sad story and move on. Keep them on it: this kid is evidence.", "move": "Turn on Read aloud for students who struggle with long paragraphs; ask them to follow the highlight.", "title": "Opening"}, {"t": 2, "say": "'The central truth of the age is a contradiction.' Write PROMISE | PRACTICE on the board and keep it there all unit.", "ask": "What two things are true at the same time in this paragraph?", "ans": "The U.S. became incredibly rich and powerful AND most people who did the work stayed poor or in danger.", "watch": "Students pick a side too early ('it was bad'). The skill is holding both.", "move": "Sentence starter on the board: 'The Gilded Age was ___ for ___, but ___ for ___.'", "title": "Opening"}, {"t": 2, "say": "The railroad made one national market. 'A factory in Chicago could now sell to the whole country.'", "ask": "Why does a railroad matter to someone who never rides it?", "ans": "Goods get cheaper and reach everywhere; factories can grow huge because they can sell nationwide.", "watch": "Students think railroads were mainly for passengers.", "move": "Quick visual: draw Chicago in the middle with lines going out to the coasts.", "title": "The machine that remade a nation"}, {"t": 2, "say": "Steel, oil, electricity, factories — name them and move. Don't lecture on each one.", "ask": "Which of these four still runs your life today?", "ans": "Electricity (phones), oil (cars, plastic), steel (buildings) — all of them.", "watch": "This slide can turn into a 10-minute lecture. Keep it to two minutes.", "move": "Have students highlight the four industries with the Highlighter; that's the whole task here.", "title": "The machine that remade a nation"}, {"t": 3, "say": "Social Darwinism: the rich said they were rich because they were 'fittest.' Say clearly: this was a false idea, and the book says so.", "ask": "If you believed Social Darwinism, how would you explain the breaker boy?", "ans": "You'd say he and his family were weak or lazy and deserved to be poor — which is the problem with the idea.", "watch": "Some students may half-agree ('if you work hard you get rich'). Don't shut them down; ask what the breaker boy's ten hours say about that.", "move": "Connect to the vocabulary slide: Social Darwinism is defined there in plain words.", "title": "The gospel of wealth"}, {"t": 2, "say": "Carnegie's 'Gospel of Wealth' is the gentler version: the rich should give money away. Point to 'notice what even this generous version assumed.'", "ask": "Carnegie gave away libraries. What did he still believe about who should be in charge of the money?", "ans": "That the rich should decide — not the workers who made it, not voters.", "watch": "Students conclude 'Carnegie was a good guy' and stop. That's fine as a starting point; the question is what it leaves out.", "move": "Plant this for Chapter 2 — the same question comes back on the philanthropy slide.", "title": "The gospel of wealth"}, {"t": 4, "say": "Be the Historian. This is where the skill lives. Model it out loud with the breaker-boy photo: what I see, who took it, why.", "ask": "Who took this photo, and what did he want people to feel?", "ans": "Lewis Hine, for the National Child Labor Committee; he wanted people to be upset about child labor so laws would change.", "watch": "Students treat photos as neutral 'proof.' The point: a photo is evidence AND it has a point of view.", "move": "This slide is the model for today's assignment, Read the Photograph. Do one step together here so the assignment isn't cold.", "title": "Be the Historian: Reading a Photograph"}, {"t": 2, "say": "Illinois Lens: Chicago burned in 1871 and rebuilt as the fastest-growing city on earth.", "ask": "Why would a city that burned down grow faster afterward?", "ans": "Everything was rebuilt new — with steel, new designs, railroads already there.", "watch": "Students from Waukegan may not know Chicago's history at all. That's normal.", "move": "Ask who has been downtown; let one student describe the Loop — it makes it real.", "title": "Illinois: the shock-city of the age"}, {"t": 2, "say": "Railroad capital, stockyards. 'Where the animals came to die' — the stockyards come back in Chapter 5 and the Wild West deep dive.", "ask": "Why did cattle from Texas end up in Chicago?", "ans": "The railroads all met in Chicago, so that's where meat could be processed and shipped everywhere.", "watch": "Some students are bothered by the slaughterhouse detail. Acknowledge it and keep moving.", "move": "Tell students: 'Hold on to this — you'll see it again in The Jungle.'", "title": "Illinois: the shock-city of the age"}, {"t": 4, "say": "Progress, exploitation, or both? This is the driving question in a different form. Push for 'both' with evidence on each side.", "ask": "Give me one piece of evidence for progress and one for exploitation.", "ans": "Progress: electric light, cheaper goods, jobs. Exploitation: child labor, 10-hour days, deadly work.", "watch": "Answers without evidence ('it was bad'). Every claim gets 'What's your evidence?'", "move": "Think-pair-share, 30-second rule: both partners speak before anyone writes. Cold-call after the pair talk, not before.", "title": "Be the Historian: Progress, Exploitation, or Both?"}, {"t": 2, "say": "Read the last two sentences aloud. Go back to PROMISE | PRACTICE on the board and fill in one line together.", "ask": "Back to the driving question: golden for whom?", "ans": "Golden for the owners and the rich; not golden for workers, children, immigrants.", "watch": "Running out of time — this is the slide teachers skip. Don't. Two minutes here makes the exit ticket work.", "move": "If short on time, skip slide 9 instead of this one.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word and its definition. Students say the word back with you.", "ask": "Which word on this list could describe something in your life today?", "ans": "Urbanization (cities growing), monopoly (one company controls something).", "watch": "Students skip vocabulary because it looks like a list.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter2.html": {"title": "Chapter 2: Robber Barons and Captains of Industry", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Say the two labels out loud — 'robber baron' and 'captain of industry' — and ask which sounds better.", "ask": "What's a baron? What's a captain? Which one would you want to be called?", "ans": "A baron is a lord or noble — a robber baron is a noble who steals. A captain leads a crew. Captain sounds better.", "watch": "Students don't know 'baron.' Define it in five seconds and move on.", "move": "Write both labels at the top of the board; students vote with a hand at the start and again at the end.", "title": "Robber Barons and Captains of Industry"}, {"t": 2, "say": "Carnegie: penniless immigrant to richest man in the world. Let the rags-to-riches story land — it's real.", "ask": "What part of Carnegie's story sounds like the American Dream?", "ans": "Came with nothing, worked as a kid, rose by his own brains and work.", "watch": "Rushing past the admiration. Students need to feel the appeal before the 'and yet.'", "move": "Have students highlight the jobs Carnegie had as a boy.", "title": "Opening"}, {"t": 2, "say": "'And yet.' Homestead, 1892 — Carnegie's company broke a strike with armed guards, and men died. He was in Scotland.", "ask": "Does it matter that Carnegie wasn't there?", "ans": "Some say no — it was his company and he approved. Some say yes — his manager did it. Both need a reason.", "watch": "This is the first strike students see; Chapter 6 covers it in depth. Don't get pulled into teaching all of Homestead now.", "move": "Say: 'We'll come back to Homestead in Chapter 6.' Write it in a parking-lot corner of the board.", "title": "Opening"}, {"t": 2, "say": "Four kings: Vanderbilt (railroads), Carnegie (steel), Rockefeller (oil), Morgan (banking). Keep it to names and empires.", "ask": "Which of these four controlled the thing all the others needed?", "ans": "Morgan (money/banks) or Vanderbilt (railroads to ship everything) — either works with a reason.", "watch": "Students mix up the names. That's fine; the quiz asks about methods, not trivia.", "move": "Quick matching on the board: name → industry. Students fill it in.", "title": "The men who owned America"}, {"t": 3, "say": "How they got so powerful: destroying competition. Rockefeller's secret railroad deals are the clearest example.", "ask": "If one company controls all the oil, what happens to the price?", "ans": "It can charge whatever it wants because there's no one else to buy from.", "watch": "'Monopoly' as only a board game. Connect to a real example students know.", "move": "Use a local example: 'What if one store owned every gas station in Waukegan?'", "title": "The men who owned America"}, {"t": 4, "say": "Be the Historian: the label IS the argument. This is today's skill. Model it: 'If I call him a captain, I'm already saying he's a hero.'", "ask": "Who would choose the label 'robber baron'? Who would choose 'captain of industry'?", "ans": "Workers, reformers, journalists → robber baron. Business owners, admirers, people who got jobs → captain.", "watch": "Students try to pick the 'right' label. The skill is noticing that each label is a point of view.", "move": "This sets up the assignment's evidence sort. Do one card together here.", "title": "Be the Historian: The Label Is the Argument"}, {"t": 2, "say": "The titans reached into government — funding campaigns, placing allies in the Senate.", "ask": "Why would a rich businessman want friends in the Senate?", "ans": "To stop laws that would hurt his company or to get laws that help it.", "watch": "Cynicism ('all politicians are bought'). Keep it historical: what happened then and what people did about it.", "move": "The cartoon 'Bosses of the Senate' is in the quiz. If it's on screen, have students describe it before you explain.", "title": "Buying the government"}, {"t": 2, "say": "Sherman Antitrust Act, 1890 — a law to break up monopolies that was barely used at first, and was even used against unions.", "ask": "Why would a law against monopolies be used against workers instead?", "ans": "Judges sided with business and said unions 'restrained trade' too.", "watch": "Students assume a law passed = a problem solved.", "move": "Promise/practice again: the law was the promise; how it was used was the practice.", "title": "Buying the government"}, {"t": 2, "say": "Illinois Lens: Pullman built a 'model town' south of Chicago — and owned everything in it.", "ask": "What would it feel like if your boss owned your house, your store, and your church?", "ans": "You couldn't complain or quit without losing everything; he controls your whole life.", "watch": "Students may think the clean town sounds nice. It was — that's the point. Ask what the catch is.", "move": "This connects to the Movers & Shakers deep dive and to Chapter 6's Pullman Strike.", "title": "Illinois: the master of his \"model town\""}, {"t": 2, "say": "The depression: Pullman cut wages but not rent. Paychecks shrank to almost nothing.", "ask": "What choices did Pullman's workers have?", "ans": "Accept it, move away (and lose their homes), or strike.", "watch": "Don't teach the whole strike here — save it for Chapter 6.", "move": "Park it: 'What did they do? Chapter 6.'", "title": "Illinois: the master of his \"model town\""}, {"t": 4, "say": "Can philanthropy offset exploitation? Carnegie's libraries still exist. Some students will have used one.", "ask": "Does giving money away later make up for how it was made?", "ans": "Yes because millions benefited; no because the workers who earned it never got it; or 'partly' with a reason.", "watch": "Students argue without using the Homestead evidence from slide 2. Send them back to it.", "move": "Honors: require a counter-claim ('Some would argue… but…').", "title": "Be the Historian: Can Philanthropy Offset Exploitation?"}, {"t": 2, "say": "The Big Picture. Go back to the vote from the cover — has anyone changed their mind?", "ask": "Builders or robbers? One sentence with one piece of evidence.", "ans": "'They were both: they built steel and oil industries, but they crushed workers like at Homestead.'", "watch": "Running out of time. This is your exit ticket — protect it.", "move": "If time is short, have students type the answer in My Notes as their exit ticket.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat. 'Trust' here means a business combination, not 'I trust you.'", "ask": "Which word on this list means the opposite of competition?", "ans": "Monopoly or trust.", "watch": "'Trust' confuses English learners because of its everyday meaning.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter3.html": {"title": "Chapter 3: The Golden Door: Immigrants in a New Land", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Ask who in the room has family who came from another country — keep it voluntary, no one has to share.", "ask": "What do you think 'the golden door' means?", "ans": "America as a door to a better life — opportunity, wealth, freedom.", "watch": "Some students or families may be recent immigrants. Keep questions about history, not about students' own status.", "move": "Never ask students about their own or their family's immigration status. Keep sharing optional and general.", "title": "The Golden Door: Immigrants in a New Land"}, {"t": 3, "say": "Read the Ellis Island scene. The chalk mark decided a family's fate.", "ask": "What could a chalk mark on your coat mean?", "ans": "An inspector thinks you're sick — you might be sent back.", "watch": "Students assume most people were turned away. Slide 5 corrects that (about 98% admitted).", "move": "Show the Ellis Island eye-inspection photo if it's on the slide; have students describe it first.", "title": "Opening"}, {"t": 2, "say": "Twenty million people — one of the biggest migrations in history. Promise on the statue, practice at the door.", "ask": "Twenty million is more than the population of Illinois today. Why would that many people take the risk?", "ans": "Life at home was worse — poverty, no land, persecution — and America had jobs.", "watch": "The number means nothing to students without a comparison.", "move": "Illinois today is about 12.5 million people; use that comparison.", "title": "Opening"}, {"t": 2, "say": "'New immigrants' came from southern and eastern Europe — Italians, Poles, Jews, Greeks — not Britain and Germany like before.", "ask": "Why would Americans react differently to these newcomers?", "ans": "Different languages, religions (Catholic, Jewish, Orthodox), they looked and sounded different.", "watch": "This sets up Chapter 4 (nativism). Don't go deep yet.", "move": "Two-column board: Old immigrants (where from) | New immigrants (where from).", "title": "A new kind of newcomer"}, {"t": 3, "say": "Push and pull — today's skill. Push drives you out; pull draws you in.", "ask": "Give me one push and one pull from this slide.", "ans": "Push: poverty, pogroms against Jews, no land. Pull: jobs, freedom, family already here.", "watch": "Students mix up which is which.", "move": "Gesture: push with hands out, pull with hands toward you. Corny, and it works. This is the assignment's sort — do one card together.", "title": "A new kind of newcomer"}, {"t": 3, "say": "Two doors. Ellis Island admitted about 98%. Angel Island in San Francisco was built to keep Chinese immigrants out and held people for weeks or months.", "ask": "Why was one door so much harder than the other?", "ans": "The law (Chinese Exclusion Act) targeted Chinese people specifically; Ellis Island mostly processed Europeans.", "watch": "Students may not know Angel Island existed — most textbooks skip it.", "move": "Plant Chapter 4: 'The law behind Angel Island is tomorrow's chapter.'", "title": "Two doors: Ellis Island and Angel Island"}, {"t": 4, "say": "Be the Historian: myth and tenement. Can both be true — that America was a land of opportunity AND that most immigrants lived in terrible conditions?", "ask": "What would you need to see to believe the golden door was real?", "ans": "Evidence of people rising: children going to school, families buying homes, communities growing.", "watch": "Students answer 'it was a lie.' Push them toward 'both' with evidence.", "move": "Sentence starter: 'The golden door was real for ___ because ___, but for ___ it ___.'", "title": "Be the Historian: The Myth and the Tenement"}, {"t": 2, "say": "Immigrants built their own worlds — neighborhoods, churches, newspapers, mutual-aid societies.", "ask": "Why would people live together with others from their home country?", "ans": "Same language, food, religion, help finding jobs and housing.", "watch": "Students see immigrants only as victims. This slide is about what they built.", "move": "Ask: 'Does Waukegan have neighborhoods like this today?' Keep it about places, not people.", "title": "Building a life in a hostile city"}, {"t": 2, "say": "'The skyscrapers of Chicago… all rested on immigrant muscle.' Whole families worked, including children.", "ask": "Name three things immigrants built that we still use.", "ans": "Railroads, bridges, buildings, steel, the meat and clothing industries.", "watch": "Time. Keep it to two minutes.", "move": "Quick list on the board; students add to it.", "title": "Building a life in a hostile city"}, {"t": 2, "say": "Illinois Lens: by 1900 most Chicagoans were immigrants or their children.", "ask": "What does 'most' mean here? More than half the city.", "ans": "More than half of the people in Chicago were born abroad or had parents who were.", "watch": "Students skim past the scale.", "move": "Highlight the list of nationalities; count them.", "title": "Illinois: the most immigrant city, and Hull House"}, {"t": 2, "say": "Jane Addams and Hull House — she moved INTO the neighborhood instead of helping from far away.", "ask": "Why does it matter that Addams lived there?", "ans": "She saw the problems up close, earned trust, knew what people actually needed.", "watch": "Addams comes back in Chapter 7 — don't do her whole biography now.", "move": "Show the Hull House rooftop school photo if it's on the slide.", "title": "Illinois: the most immigrant city, and Hull House"}, {"t": 2, "say": "Read the closing paragraph: 'Give me your tired, your poor.' Back to the driving question.", "ask": "What did immigrants actually find? One sentence, one piece of evidence.", "ans": "'They found hard work and crowded tenements, but they built communities like ___.'", "watch": "This chapter has no Big Picture slide — this Illinois slide is your closing. Don't skip it.", "move": "Exit ticket in My Notes.", "title": "Illinois: the most immigrant city, and Hull House"}, {"t": 2, "say": "Read each word; students repeat. Push and pull factors are the core of today's assignment.", "ask": "Which word names a place where reformers lived with immigrants?", "ans": "Settlement house (Hull House).", "watch": "'Tenement' and 'settlement' sound alike to English learners.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter4.html": {"title": "Chapter 4: Fear and Exclusion", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Set the norm for hard history now: 'We study what happened to people with care. We quote ugly ideas accurately, and we disagree with ideas, not classmates.'", "ask": "What does it mean to 'close the door' on someone?", "ans": "Keep them out — stop them from coming in or belonging.", "watch": "This chapter is about prejudice by nationality and religion. Some students may hear echoes of today. Let the history do the work; don't editorialize.", "move": "If a student brings up current events, acknowledge it briefly: 'Historians ask how the past connects to now — hold that thought for the end.'", "title": "Fear and Exclusion"}, {"t": 3, "say": "Read the Chinese laborer's story. The 1882 law barred him for one reason: he was Chinese.", "ask": "What's new about this law compared to anything before it?", "ans": "It was the first U.S. law to ban people by nationality.", "watch": "Students don't know Chinese workers built the transcontinental railroad.", "move": "Connect to Chapter 3's Angel Island — same story, other side.", "title": "Opening"}, {"t": 2, "say": "'The dark companion to the last chapter.' Who counted as a 'true American' — decided by law and by mob.", "ask": "What's the difference between excluding people by law and by mob?", "ans": "Law is official and permanent; a mob is violent and illegal — both kept people out.", "watch": "Students think prejudice only came from 'bad people,' not from laws.", "move": "Two-column board: By law | By mob. Fill it in as the chapter goes.", "title": "Opening"}, {"t": 3, "say": "Chinese exclusion: tolerated when labor was needed, blamed when the economy turned bad.", "ask": "Why would people turn on immigrants when jobs got scarce?", "ans": "They blamed them for taking jobs or lowering wages; scapegoating.", "watch": "Students accept 'they took our jobs' as the real reason. Push: who actually set wages?", "move": "Introduce 'scapegoat' if students need a word for it.", "title": "The first door slams: Chinese exclusion"}, {"t": 3, "say": "Eugenics: a false science that claimed some groups were born better than others. Say clearly that it was wrong — and that respected scientists believed it.", "ask": "Why is it more dangerous when prejudice calls itself 'science'?", "ans": "People trust science, so it seems like proof; it made prejudice respectable and turned it into law.", "watch": "Students may ask whether any of it was true. Answer directly: no, it was debunked; it was used to justify sterilization and immigration limits.", "move": "Keep the quiz's 'Uncle Sam' cartoon in mind — this is the context for it.", "title": "Inventing a science of prejudice"}, {"t": 2, "say": "'Gave old hatreds a lab coat.' Anti-Catholic and antisemitic prejudice found new forms.", "ask": "What does 'gave old hatreds a lab coat' mean?", "ans": "Old prejudices got dressed up to look scientific.", "watch": "Figurative language trips up English learners.", "move": "Act it out: put on an imaginary lab coat. Then ask what changed (only how it looks).", "title": "Inventing a science of prejudice"}, {"t": 4, "say": "Be the Historian: read a law as evidence of fear. This is today's skill and the assignment. Model: 'This law tells me what Congress was afraid of in 1882.'", "ask": "If a law bans something, what does that tell you about the people who wrote it?", "ans": "What they feared or disliked — here, Chinese workers and competition.", "watch": "Students summarize what the law did instead of what it reveals.", "move": "Two questions on the board: What did it do? What does it show they feared? Do the first chunk of the assignment together.", "title": "Be the Historian: A Law as Evidence of Fear"}, {"t": 2, "say": "Literacy tests, then quotas — the door kept closing until the 1920s.", "ask": "Who would a literacy test keep out?", "ans": "Poor immigrants who never got to go to school — mostly from southern and eastern Europe.", "watch": "Literacy tests reappear in Chapter 8, used against Black voters. Flag it.", "move": "Say: 'Remember this tool — you'll see it again in Chapter 8.'", "title": "The road to the closed gate"}, {"t": 2, "say": "Illinois Lens: Chicago had more immigrants and radicals than almost anywhere — so fear ran hot.", "ask": "Why would a big immigrant city be where fear was strongest?", "ans": "More newcomers, more strikes and radical ideas, so more people to blame.", "watch": "Students may think Illinois was more welcoming. It was both.", "move": "Keep it short — this sets up Haymarket.", "title": "Illinois: a city's fears come to a boil"}, {"t": 2, "say": "Haymarket, 1886, preview: immigrant anarchists were tried for their ideas. Full story in Chapter 6.", "ask": "What's the difference between being punished for what you did and for what you believe?", "ans": "Punished for an act needs proof of the act; punished for beliefs means no proof was needed.", "watch": "Don't teach Haymarket now — you'll lose 15 minutes.", "move": "Parking lot: 'Chapter 6.'", "title": "Illinois: a city's fears come to a boil"}, {"t": 4, "say": "Who gets to define 'American'? By ideals (anyone who believes in liberty and equality) or by blood and birth?", "ask": "Which definition did the Chinese Exclusion Act use?", "ans": "Blood and birth/nationality — it didn't matter what Chinese workers believed.", "watch": "This can get personal. Keep it on historical evidence.", "move": "Honors: add a counter-claim and an example from another chapter.", "title": "Be the Historian: Who Gets to Define \"american\"?"}, {"t": 2, "say": "The hard truth beside the inspiring story — 'an honest history must hold both.'", "ask": "Can a country be a nation of immigrants AND keep immigrants out? How?", "ans": "Yes — it welcomed some groups and excluded others at the same time.", "watch": "Time.", "move": "Use this as your exit-ticket prompt if the final slide runs short.", "title": "The Big Picture"}, {"t": 1, "say": "Transition: 'Now back to the city itself' — Chapter 5. Read and move on.", "ask": "", "ans": "", "watch": "", "move": "", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat. Nativism and eugenics are the two most-missed quiz words.", "ask": "What's the root of 'nativism'?", "ans": "Native — born here; favoring people born here over newcomers.", "watch": "Literacy test has two meanings in this unit (immigrants and voters).", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter5.html": {"title": "Chapter 5: Life in the Industrial City", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Hard content warning, briefly: 'Today starts with a fire where young women died. We'll treat it with respect.'", "ask": "When a city grows fast, who pays for it?", "ans": "Workers, the poor, people in crowded housing, children.", "watch": "The Triangle fire is graphic. Prepare students; don't dwell on the jumping.", "move": "Let students know they can look away from images; the text carries the evidence.", "title": "Life in the Industrial City"}, {"t": 3, "say": "Triangle Shirtwaist fire, 1911: doors locked, 146 workers died, mostly young immigrant women.", "ask": "Why were the doors locked?", "ans": "Owners locked them to stop workers from taking breaks or stealing.", "watch": "Students may be upset. Pause for a breath after reading.", "move": "This is the case for today's assignment, Accident or System?", "title": "Opening"}, {"t": 2, "say": "'The industrial city distilled into a single afternoon.' Promise and practice collide.", "ask": "What was the promise of the city? What was the practice at Triangle?", "ans": "Promise: jobs, opportunity, excitement. Practice: dangerous work, locked doors, death.", "watch": "Students lose the promise side. Name it.", "move": "Back to the PROMISE | PRACTICE board.", "title": "Opening"}, {"t": 2, "say": "The U.S. went from farms to cities in a few decades. People came from abroad and from the countryside.", "ask": "Where did city people come from?", "ans": "Immigrants from abroad and Americans leaving farms.", "watch": "Students think only immigrants filled cities.", "move": "Quick numbers if you have them: Chicago went from about 300,000 (1870) to 1.7 million (1900).", "title": "The city explodes"}, {"t": 2, "say": "Cities grew faster than housing, water, and sewers. Tenements packed families into dark rooms.", "ask": "What's missing from a tenement that you'd need to stay healthy?", "ans": "Light, fresh air, clean water, toilets, space.", "watch": "Abstract for students who've never seen a tenement.", "move": "Show a Riis photo if on the slide; ask 'What do you notice?' before explaining.", "title": "The city explodes"}, {"t": 3, "say": "Jacob Riis, How the Other Half Lives (1890): the camera made the slums visible to the rich.", "ask": "Why did photos change minds when words hadn't?", "ans": "People could see it for themselves; it was harder to deny or ignore.", "watch": "Students treat Riis as purely heroic. He also used stereotypes about immigrants — mention it if a student is ready.", "move": "Connect to Chapter 1's Lewis Hine — same skill: a photo is evidence with a point of view.", "title": "Exposing the other half"}, {"t": 4, "say": "Be the Historian: accident or system? This is the assignment. Model: 'If it was an accident, nothing could fix it. If it was a system, laws could.'", "ask": "What evidence would show Triangle was a system, not an accident?", "ans": "Locked doors, no sprinklers, no inspections, owners who got off lightly, other fires like it.", "watch": "Students pick 'accident' because fires happen. Ask: why did so many die at THIS fire?", "move": "Do the first sort item together, then release to the assignment.", "title": "Be the Historian: Accident, or System?"}, {"t": 2, "say": "Political machines: groups like Tammany Hall that traded jobs and favors for votes.", "ask": "If you were a new immigrant with no job, why might you vote for the machine?", "ans": "They gave you a job, coal in winter, help with the police — the government didn't.", "watch": "Students only see the corruption.", "move": "Draw the trade: favors → votes → power → more favors.", "title": "The machine and the boss"}, {"t": 2, "say": "Corrupt AND useful. 'Morally complicated' is the key phrase.", "ask": "Can something be corrupt and helpful at the same time?", "ans": "Yes — the machine stole money but also fed and housed people the city ignored.", "watch": "Students want one answer. Hold both.", "move": "Thomas Nast's 'Tammany Tiger' cartoon is in this chapter's sources; have students describe it.", "title": "The machine and the boss"}, {"t": 2, "say": "Illinois Lens: Upton Sinclair's The Jungle (1906), about Chicago's stockyards.", "ask": "What did Sinclair go to Chicago to find?", "ans": "How immigrant workers were treated in the meatpacking plants.", "watch": "Students know nothing about the book. That's fine.", "move": "Hook: 'He aimed at one thing and hit something else. Watch.'", "title": "Illinois: the jungle of the stockyards"}, {"t": 2, "say": "'I aimed at the public's heart, and by accident I hit it in the stomach.' Readers cared more about dirty meat than about the workers.", "ask": "What law came out of The Jungle — and who did it help?", "ans": "The Pure Food and Drug Act and Meat Inspection Act; it helped consumers more than workers.", "watch": "Students think the workers got help. They mostly didn't.", "move": "This is a classic quiz item; highlight 'Pure Food and Drug Act.'", "title": "Illinois: the jungle of the stockyards"}, {"t": 2, "say": "Closing: 'the age's contradiction made concrete and piled nine stories high.' Back to the driving question.", "ask": "Who paid the price for the city's growth? One sentence, one piece of evidence.", "ans": "'Workers like the Triangle women paid the price, because ___.'", "watch": "This chapter closes on the Illinois slide. Don't skip it.", "move": "Exit ticket in My Notes.", "title": "Illinois: the jungle of the stockyards"}, {"t": 2, "say": "Read each word; students repeat. Muckraker returns in Chapter 7.", "ask": "What's a 'muckrake'? Why would that be a nickname for a journalist?", "ans": "A rake for dirt or manure; journalists dug up the dirt on the powerful.", "watch": "Political machine is abstract — tie it back to slide 7.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter6.html": {"title": "Chapter 6: Strikes and Solidarity", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. The cover image is the Harper's Weekly engraving of the Haymarket bomb. Ask what it shows before you explain it.", "ask": "This picture was published days after the event. Was the artist there? How might it shape what readers believed?", "ans": "Probably not there; it makes the workers look violent and dangerous, so readers would blame them.", "watch": "Students treat the engraving as a photo of what happened.", "move": "That question IS the hook in the lesson plan. Quick-write two sentences, then pair share.", "title": "Strikes and Solidarity"}, {"t": 3, "say": "Read the Haymarket opening. Stop after 'No one ever proved who threw the bomb.' Let it sit.", "ask": "If no one proved who threw the bomb, why were eight men convicted?", "ans": "For their beliefs and speeches — the city wanted someone punished.", "watch": "Students assume conviction means guilt.", "move": "Write PROVEN | NOT PROVEN | OPINION on the board. You'll use it for the assignment.", "title": "Opening"}, {"t": 2, "say": "A war over the most basic promise: hard work earns a fair share. Illinois was its bloodiest battlefield.", "ask": "What did workers want? List three things.", "ans": "Higher wages, shorter hours (eight-hour day), safe conditions.", "watch": "Students think strikes were about greed.", "move": "Students highlight the 'practice' details: poverty wages, eighty-hour weeks.", "title": "Opening"}, {"t": 3, "say": "'Imagine yourself as a worker.' Read it as a scenario. Then: one worker alone has no power.", "ask": "If you complain alone, what happens? If everyone stops working together?", "ans": "Alone, you're fired and replaced. Together, the factory stops and the owner has to listen.", "watch": "Students don't understand why unions mattered.", "move": "Quick demo: one student 'quits' and is replaced; the whole row quits and nothing gets made.", "title": "Why workers organized"}, {"t": 3, "say": "The great battles: 1877 Railroad Strike, Haymarket 1886, Homestead 1892, Pullman 1894. Each time, troops or courts sided with owners.", "ask": "What pattern do you see in how these strikes ended?", "ans": "The government sent troops or courts ordered workers back; workers usually lost.", "watch": "Four strikes blur together.", "move": "Quick timeline on the board with four dates; students copy it into My Notes.", "title": "The great battles"}, {"t": 2, "say": "Knights of Labor (everyone welcome, faded after Haymarket) vs. AFL (skilled workers only, modest goals, survived).", "ask": "Why did the bigger, more open union fade and the narrower one survive?", "ans": "Knights were blamed for Haymarket; AFL avoided radicals and asked for practical things.", "watch": "This is a quiz question (Knights vs. AFL). Make sure the difference is clear.", "move": "T-chart: Knights | AFL — who could join, goals, what happened.", "title": "The great battles"}, {"t": 5, "say": "Be the Historian: Who threw the bomb? This is the assignment's skill. Model one statement: 'A bomb was thrown — proven. The defendants planned it — not proven.'", "ask": "Is 'the anarchists' speeches caused the bomb' proven, not proven, or opinion?", "ans": "Not proven or opinion — no evidence linked any speaker to the bomb.", "watch": "Students confuse 'not proven' with 'false.' Not proven means the evidence doesn't reach that far.", "move": "Guided practice from the lesson plan: try item 1 with a partner, check together, then release.", "title": "Be the Historian: Who Threw the Bomb?"}, {"t": 2, "say": "Illinois Lens: Illinois was the cockpit of American labor — Haymarket and Pullman both happened here.", "ask": "Why would Chicago be the center of labor battles?", "ans": "Railroads, factories, stockyards — the most workers and the most industry.", "watch": "Time.", "move": "Keep it to two minutes.", "title": "Illinois: the cockpit of American labor"}, {"t": 3, "say": "Pullman 1894: wages cut, rents not. Debs's union joined; federal troops ended it; Debs went to jail and came out a socialist.", "ask": "The government said it sent troops to protect the mail. Was that the real reason?", "ans": "It was the legal reason; the real effect was breaking the strike for the railroad companies.", "watch": "Connects to Chapter 2's Pullman slides — students may remember the 'model town.'", "move": "Ask: 'Where have we seen Pullman before?' Let them make the link.", "title": "Illinois: the cockpit of American labor"}, {"t": 4, "say": "Why was American labor weaker than Europe's? Diversity used to divide workers, belief in the American Dream, force, the AFL's narrow focus.", "ask": "How does setting workers against each other by race or nationality help employers?", "ans": "Divided workers can't strike together; owners can bring in one group to replace another.", "watch": "This is abstract. Use a concrete example: strikebreakers.", "move": "Honors: rank the four reasons and defend #1.", "title": "Be the Historian: Why Was American Labor Weaker?"}, {"t": 2, "say": "In the short run, workers lost. Strikes broken, unions crushed.", "ask": "If they lost, why study them?", "ans": "Because they changed ideas and set up later wins — the next slide shows it.", "watch": "Students conclude it was pointless.", "move": "Bridge straight to the next slide.", "title": "The Big Picture"}, {"t": 2, "say": "'And yet.' Solidarity couldn't be unlearned; the eight-hour day eventually became law. May Day is still celebrated worldwide.", "ask": "Back to the driving question: why did workers fight back, and why did they lose?", "ans": "They fought because conditions were deadly and wages too low; they lost because owners had troops, courts, and money on their side.", "watch": "Protect the time for this. It's the exit ticket.", "move": "Cold-call two students for an evidence answer, then exit ticket.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat. Solidarity is the big idea word.", "ask": "What's the root of 'solidarity'?", "ans": "Solid — standing together firmly.", "watch": "Students confuse Haymarket and Pullman on the quiz.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter7.html": {"title": "Chapter 7: Voices for Reform", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Ask students to name a time a video or news story made people demand a change.", "ask": "Can telling the truth change a law? Give me a guess before we start.", "ans": "Yes if enough people get angry; no if powerful people block it. Either is a fine start.", "watch": "Modern examples can get political fast. Keep it general and move on.", "move": "Students write their guess in My Notes and revisit it at the end.", "title": "Voices for Reform"}, {"t": 3, "say": "Muckrakers: journalists who went into mines and packinghouses to find what the powerful hid. The name was half insult, half badge.", "ask": "Why would a president call journalists 'muckrakers' as an insult — and why would they wear it proudly?", "ans": "He thought they only looked at dirt; they were proud of digging up the truth.", "watch": "Muckraker was taught in Chapter 5. Ask students to define it before you do.", "move": "Quick recall: 'Who remembers The Jungle?'", "title": "Opening"}, {"t": 2, "say": "Progressivism: problems caused by industry could be fixed by government and organized citizens.", "ask": "What's the big new idea here?", "ans": "Government should step in to fix problems instead of leaving business alone.", "watch": "'Progressive' is a modern political word. Clarify it means this era's reform movement.", "move": "Write the definition from the vocabulary slide on the board now.", "title": "Opening"}, {"t": 3, "say": "Ida Tarbell took apart Standard Oil with careful evidence. Exposure could change the law.", "ask": "What made Tarbell's reporting hard to deny?", "ans": "Documents and detail — she proved how Rockefeller crushed competitors.", "watch": "This is today's assignment: Match the Muckraker. Name each muckraker and target clearly.", "move": "Board list: Muckraker → What they exposed → What changed.", "title": "Dragging the truth into the light"}, {"t": 2, "say": "The muckrakers' faith: if people really see the truth, they won't live with it.", "ask": "Where have we seen this same faith earlier in the unit?", "ans": "Riis's photos (Ch 5), Hine's breaker boys (Ch 1).", "watch": "Students treat each chapter as separate. Connect them.", "move": "Point back to the PROMISE | PRACTICE board.", "title": "Dragging the truth into the light"}, {"t": 3, "say": "Theodore Roosevelt: trust-busting, the Square Deal, railroad regulation.", "ask": "What did Roosevelt mean by a 'square deal'?", "ans": "Fair treatment for workers, owners, and consumers — not just one side.", "watch": "Students think Roosevelt broke up every trust. He went after 'bad' trusts.", "move": "Show the 'Beef Trust' cartoon if it's on the slide; ask who's holding the gun.", "title": "Taming the giants"}, {"t": 2, "say": "Wins: food and drug laws, child-labor limits, worker protections, conservation.", "ask": "Which of these still protects you today?", "ans": "Food safety labels, national parks, limits on teen work hours.", "watch": "Time — this list can sprawl.", "move": "Students highlight the three wins they think matter most.", "title": "Taming the giants"}, {"t": 4, "say": "Be the Historian: can journalism change the law? Mixed evidence — The Jungle worked, but not for the workers it was about.", "ask": "Give one case where exposure worked and one where it didn't.", "ans": "Worked: Pure Food and Drug Act, Standard Oil broken up. Didn't: workers' conditions stayed bad; lynching (next slides).", "watch": "Students say 'yes it works' without the limits.", "move": "Model the assignment's argument part with this question.", "title": "Be the Historian: Can Journalism Change the Law?"}, {"t": 2, "say": "Illinois Lens: Hull House was a national center of reform — child labor laws, juvenile courts, public health.", "ask": "How did Hull House go from a neighborhood center to changing state law?", "ans": "Its residents collected evidence about their neighbors and lobbied for laws.", "watch": "Students remember Addams from Chapter 3. Let them tell you.", "move": "Mention Florence Kelley if time; she's in Movers & Shakers.", "title": "Illinois: Hull House and the crusade the Progressives wouldn't join"}, {"t": 3, "say": "Ida B. Wells exposed lynching — and most Progressives refused to stand beside her.", "ask": "Why would reformers who cared about meat and monopolies ignore lynching?", "ans": "Racism; they didn't see Black Americans as part of the people they were fighting for; politics.", "watch": "Wells is central in Chapters 9 and 10. Introduce her well.", "move": "Ask students to predict: 'Will she come back?' (Yes, twice.)", "title": "Illinois: Hull House and the crusade the Progressives wouldn't join"}, {"t": 4, "say": "Justice or order? Were Progressives fighting for fairness or for control — of immigrants, the poor, behavior?", "ask": "Name one Progressive reform that helped people and one that controlled them.", "ans": "Helped: food safety, child labor laws. Controlled: Prohibition, censorship, ignoring race.", "watch": "Students haven't heard the 'control' side before. Give an example (Chicago's 1907 movie censorship law).", "move": "Honors: write a claim that holds both.", "title": "Be the Historian: Justice, or Order?"}, {"t": 2, "say": "'Genuinely hopeful and cautionary.' Resist making it only one.", "ask": "What was the promise of Progressivism?", "ans": "That democracy could tame big business and protect ordinary people.", "watch": "Time.", "move": "Bridge to next slide.", "title": "The Big Picture"}, {"t": 2, "say": "The blind spot: race. The same era built Jim Crow. Back to the driving question.", "ask": "Can exposing the truth change the law? Check your guess from the cover.", "ans": "'Sometimes — it worked for ___ but not for ___ because ___.'", "watch": "Protect exit-ticket time.", "move": "Students revise their My Notes guess in one sentence.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat.", "ask": "Which word describes protecting forests and rivers?", "ans": "Conservation.", "watch": "'Trust-busting' needs 'trust' from Chapter 2.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter8.html": {"title": "Chapter 8: Democracy Expanding and Contracting", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Draw an arrow going up and an arrow going down on the board. 'Both happened in the same years.'", "ask": "How could democracy grow and shrink at the same time?", "ans": "It grew for some people and shrank for others.", "watch": "Students think of democracy as one thing everyone has equally.", "move": "Keep the two arrows up all period; label them as you go.", "title": "Democracy Expanding and Contracting"}, {"t": 3, "say": "Read the Mississippi courthouse scene. The test was designed so he could never pass — and his white neighbor who couldn't read was waved through.", "ask": "Was the test about reading?", "ans": "No — it was about keeping Black men from voting.", "watch": "This is the skill for today: reading a law for its real intent.", "move": "Write 'What it says vs. what it does' on the board.", "title": "Opening"}, {"t": 2, "say": "The paradox: more democracy for some, less for others, at the same time.", "ask": "What does 'paradox' mean?", "ans": "Two things that seem impossible together but are both true.", "watch": "English learners may not know 'paradox.'", "move": "Give a simple example: 'Sometimes you have to slow down to go faster.'", "title": "Opening"}, {"t": 3, "say": "Expanding: direct election of senators (17th Amendment), primaries, initiative and referendum, women's suffrage in some states.", "ask": "Before this, who picked U.S. senators?", "ans": "State legislatures, not the voters.", "watch": "Students don't know senators weren't always elected.", "move": "Up-arrow list on the board.", "title": "Democracy expanding"}, {"t": 3, "say": "Contracting: across the South, Black Americans' right to vote was taken apart after Reconstruction.", "ask": "What happened to Black voters between Reconstruction and 1900?", "ans": "They had voted in large numbers; then laws and violence pushed them out.", "watch": "Students may not remember Unit 2's Reconstruction amendments.", "move": "Quick recall: '15th Amendment — what did it promise?'", "title": "Democracy contracting"}, {"t": 3, "say": "The system: poll taxes, literacy tests, grandfather clauses, white primaries, violence. They worked together.", "ask": "How did the grandfather clause let poor white men vote but not Black men?", "ans": "You could skip the test if your grandfather could vote before 1867 — when Black men couldn't.", "watch": "The grandfather clause is confusing. Walk through it slowly.", "move": "Down-arrow list on the board, one tool per line.", "title": "Democracy contracting"}, {"t": 5, "say": "Be the Historian: read a law for its real intent. The laws never mentioned race. Model it with the literacy test.", "ask": "The law says 'voters must be able to read.' What clues show its real purpose?", "ans": "Who ran the test (white registrars), who failed, the grandfather clause exemption, the speeches of the men who wrote it.", "watch": "Students accept the neutral wording at face value.", "move": "This sets up the T-chart assignment: Expanding | Shrinking. Do one card together.", "title": "Be the Historian: Reading a Law for Its Real Intent"}, {"t": 3, "say": "Plessy v. Ferguson, 1896: Homer Plessy sat in a whites-only car on purpose to test the law. The Court said 'separate but equal' was constitutional.", "ask": "Why would Plessy get arrested on purpose?", "ans": "To bring a test case to court and challenge the law.", "watch": "Students think Plessy was caught by accident.", "move": "Connect forward: Brown v. Board overturned it in 1954.", "title": "The Court says \"separate but equal\""}, {"t": 2, "say": "Separate was never equal — and separate was the whole point.", "ask": "What evidence shows 'separate but equal' was never equal?", "ans": "Black schools, hospitals, train cars got far less money and were in worse condition.", "watch": "Time.", "move": "The Supreme Court photo is in the quiz; point it out.", "title": "The Court says \"separate but equal\""}, {"t": 2, "say": "Illinois Lens: 1913, Illinois women won the presidential vote — first state east of the Mississippi.", "ask": "Is this an up-arrow or a down-arrow?", "ans": "Up — democracy expanding.", "watch": "Students may think women everywhere voted after 1913.", "move": "Bridge: 'The full fight is Chapter 9.'", "title": "Illinois: a breakthrough on the prairie"}, {"t": 2, "say": "Won by a careful campaign of Chicago suffragists.", "ask": "Why do you think Illinois went first in the East?", "ans": "Strong Chicago organizing, reform energy from Hull House and others.", "watch": "Time.", "move": "Keep short.", "title": "Illinois: a breakthrough on the prairie"}, {"t": 4, "say": "Expanding and shrinking at once. Hold both halves together.", "ask": "Who gained power in these years, and who lost it?", "ans": "Gained: voters choosing senators, some women. Lost: Black Southerners, some poor whites, immigrants (literacy tests).", "watch": "Students list without explaining how both could happen.", "move": "Starter: 'Democracy grew for ___ while it shrank for ___ because ___.'", "title": "Be the Historian: Expanding and Shrinking At Once"}, {"t": 2, "say": "Read the closing. Back to the arrows: one sentence that uses both.", "ask": "How could democracy grow and shrink at the same time?", "ans": "'Reforms gave more power to some voters while Jim Crow laws took it from Black Southerners.'", "watch": "Protect exit-ticket time.", "move": "Exit ticket in My Notes.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat. 'Disenfranchisement' is long — break it up: dis-en-franchise-ment.", "ask": "What does 'franchise' mean here?", "ans": "The right to vote; dis-en-franchise = take it away.", "watch": "Literacy test appears again (Chapter 4 meaning too).", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter9.html": {"title": "Chapter 9: Seventy-Two Years: The Fight for Suffrage", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. Ask: '72 years — how old would someone be who started this fight at 25?' (97.)", "ask": "Why might it take 72 years to win one right?", "ans": "Powerful people opposed it; tradition; women couldn't vote to change it.", "watch": "Students assume women just 'got' the vote.", "move": "Timeline on the board: 1848 ———— 1920.", "title": "Seventy-Two Years: The Fight for Suffrage"}, {"t": 3, "say": "Silent Sentinels, 1917: arrested at the White House, force-fed in jail, while the country fought 'for democracy' abroad.", "ask": "What's the contradiction the Sentinels were pointing at?", "ans": "Wilson said the war was for democracy, but women at home couldn't vote.", "watch": "Force-feeding is graphic. Mention, don't describe.", "move": "Show the picket photo if it's on the slide; ask what the banners say.", "title": "Opening"}, {"t": 2, "say": "The longest reform movement in American history. 'All men are created equal' — the promise.", "ask": "How did suffragists use the Declaration of Independence?", "ans": "They pointed out it said 'all men' and demanded 'all men and women.'", "watch": "Time.", "move": "Bridge to Seneca Falls.", "title": "Opening"}, {"t": 3, "say": "Seneca Falls, 1848: Stanton and Mott's Declaration of Sentiments rewrote the Declaration to include women.", "ask": "Why copy the Declaration of Independence instead of writing something new?", "ans": "To show the country already promised equality — they were just holding it to its word.", "watch": "Students don't know the Declaration's wording.", "move": "Put 'all men and women are created equal' on the board.", "title": "Seneca Falls and the long beginning"}, {"t": 3, "say": "The split after the Civil War: the 15th Amendment gave Black men the vote but not women; the movement divided.", "ask": "Why did the suffrage and abolition movements split?", "ans": "Some suffragists opposed giving Black men the vote before women; some used racist arguments.", "watch": "This is uncomfortable history about heroes. Don't soften it — it sets up Wells.", "move": "Ask: 'What does this tell us about who was in charge of the movement?'", "title": "Seneca Falls and the long beginning"}, {"t": 3, "say": "Seventy years of petitions and defeats. Susan B. Anthony was arrested for voting in 1872.", "ask": "Why would someone keep fighting for something they might not live to see?", "ans": "For their daughters and granddaughters; because it was right.", "watch": "Time on biography.", "move": "This is today's assignment: timeline sequencing. Point out dates as you go.", "title": "The long, grinding campaign"}, {"t": 2, "say": "The West led: Wyoming, Colorado, Utah, Idaho — decades before the nation.", "ask": "Why would the frontier West give women the vote first?", "ans": "Women did equal hard work there; territories wanted settlers; politics.", "watch": "Students assume the East led.", "move": "Show the Wyoming polls engraving if it's on the slide.", "title": "The long, grinding campaign"}, {"t": 4, "say": "Be the Historian: why 72 years? Depth of tradition, opposition, splits in the movement, a constitutional amendment is very hard to pass.", "ask": "Which reason was the biggest? Why?", "ans": "Any, with a reason — e.g., 'An amendment needs two-thirds of Congress and three-fourths of states.'", "watch": "Students list reasons without ranking.", "move": "Honors: rank and defend.", "title": "Be the Historian: Why Seventy-two Years?"}, {"t": 2, "say": "Illinois Lens: the 1913 Illinois vote (from Chapter 8) — and its racial reckoning.", "ask": "What happened in Illinois in 1913?", "ans": "Women won the right to vote for president.", "watch": "Time.", "move": "Quick recall from Chapter 8.", "title": "Illinois leads, and Ida B. Wells refuses the back of the line"}, {"t": 3, "say": "Ida B. Wells founded the Alpha Suffrage Club. At the 1913 Washington march, Black women were told to march at the back. Wells refused and joined the Illinois group mid-march.", "ask": "Why does it matter that Wells refused the back of the line?", "ans": "She wouldn't accept second-class treatment from her own movement.", "watch": "This is the heart of the chapter's argument.", "move": "Ask students to predict what the organizers did. (Nothing could stop her — she stepped in.)", "title": "Illinois leads, and Ida B. Wells refuses the back of the line"}, {"t": 2, "say": "Illinois raced to ratify the 19th Amendment first, but a clerical mistake meant it had to vote again.", "ask": "What does the stumble tell us?", "ans": "Illinois wanted credit for being first; even history has clerical errors.", "watch": "Students spend too long on the trivia.", "move": "Keep to one minute.", "title": "Illinois leads, and Ida B. Wells refuses the back of the line"}, {"t": 4, "say": "Did the 19th Amendment enfranchise all women? It removed sex as a barrier — but poll taxes and literacy tests still blocked Black women in the South.", "ask": "Who still couldn't vote after 1920?", "ans": "Most Black women in the South; many Native American women (not citizens until 1924); some Asian immigrant women.", "watch": "Students assume 1920 means everyone.", "move": "Connect to Chapter 8's tools — same poll taxes and literacy tests.", "title": "Be the Historian: Did the Nineteenth Amendment Enfranchise All Women?"}, {"t": 2, "say": "A great triumph across three generations.", "ask": "What did the 19th Amendment win?", "ans": "The right to vote can't be denied because of sex.", "watch": "Time.", "move": "Bridge to next slide.", "title": "The Big Picture"}, {"t": 2, "say": "'Held only partway.' Back to the driving question.", "ask": "Why did it take 72 years? One sentence with evidence.", "ans": "'It took 72 years because ___, and even then ___.'", "watch": "Protect exit-ticket time.", "move": "Exit ticket in My Notes.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat.", "ask": "What's the difference between 'suffrage' and 'suffering'?", "ans": "Suffrage is the right to vote; they just sound alike.", "watch": "English learners confuse suffrage and suffer.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "chapter10.html": {"title": "Chapter 10: Whose Voices Were Left Out?", "slides": [{"t": 3, "say": "Read the driving question aloud, then have students copy it into My Notes. Tell them: by the end of class you'll answer this with evidence. This is the hardest chapter emotionally. Set the norm again before you start, and know who in the room might be affected.", "ask": "In a time of reform, who might have been left out?", "ans": "Black Americans, immigrants, Native Americans, the poor.", "watch": "Lynching is discussed directly. Plan with Tom how much imagery to show.", "move": "Tell students the chapter is about resistance as much as violence — they'll meet people who fought back.", "title": "Whose Voices Were Left Out?"}, {"t": 3, "say": "Ida B. Wells learned three friends were murdered by a mob in Memphis, and began her investigation.", "ask": "What did Wells do with her grief?", "ans": "She investigated and wrote — she turned it into evidence.", "watch": "Students may not know what lynching is. Define it plainly: murder by a mob without a trial.", "move": "Keep the definition on the board.", "title": "Opening"}, {"t": 2, "say": "This chapter belongs to the people the age of reform left behind.", "ask": "Name one group that gained something in this unit, and one that didn't.", "ans": "Gained: consumers, some workers, some women. Didn't: Black Americans in the South.", "watch": "Time.", "move": "Quick list from earlier chapters.", "title": "Opening"}, {"t": 3, "say": "The nadir: the lowest point for Black Americans after slavery — Jim Crow, disenfranchisement, sharecropping, violence.", "ask": "What does 'nadir' mean? Why that word?", "ans": "The lowest point; things got worse after Reconstruction's progress.", "watch": "Students think things improved steadily after slavery.", "move": "Draw a line going up (Reconstruction) and then down (the nadir).", "title": "The nadir"}, {"t": 3, "say": "Lynching was the engine of terror — thousands murdered, often as public spectacle.", "ask": "Why would mobs make it a public event?", "ans": "To terrorize the whole Black community and enforce Jim Crow.", "watch": "Do not show lynching photographs. The text is enough.", "move": "Give students a moment. Check in with anyone visibly affected after class.", "title": "The nadir"}, {"t": 5, "say": "Be the Historian: Wells and the power of numbers. She gathered statistics to destroy the lie used to justify lynching.", "ask": "What did Wells's numbers prove?", "ans": "Most victims weren't even accused of the crime used as the excuse; lynching was about power and terror.", "watch": "This is a model of evidence beating propaganda — connect to Haymarket's proven/not proven.", "move": "Ask: 'Where else have we used evidence to test a claim?' (Haymarket, Triangle.)", "title": "Be the Historian: Wells and the Power of Numbers"}, {"t": 3, "say": "Booker T. Washington: build skills and economic strength first; don't demand equality yet.", "ask": "Why might Washington's plan make sense in an age of lynching?", "ans": "Open demands could get people killed; economic progress was a safer start.", "watch": "Students dismiss Washington as wrong. Make his case fairly first.", "move": "This is the assignment: point of view. Two columns on the board: Washington | Du Bois.", "title": "Two roads: Washington and Du Bois"}, {"t": 3, "say": "W.E.B. Du Bois: demand full rights now — accepting second-class status only keeps you there.", "ask": "What's Du Bois's main argument against Washington?", "ans": "Accepting less teaches the country you'll settle for less; rights must be demanded.", "watch": "Students pick Du Bois because he 'sounds right' without engaging Washington's reasons.", "move": "Fill the second column.", "title": "Two roads: Washington and Du Bois"}, {"t": 3, "say": "Illinois Lens: Springfield 1908 — a white mob attacked Black neighborhoods in Lincoln's hometown.", "ask": "Why did it matter that this happened in Springfield?", "ans": "It proved racial terror wasn't just a Southern problem.", "watch": "Students may be surprised it happened in Illinois. Let the surprise land.", "move": "Connect: this is close to home.", "title": "Illinois: the riot that built the NAACP"}, {"t": 2, "say": "The NAACP was founded in 1909, partly in response to Springfield.", "ask": "How did the NAACP plan to fight back?", "ans": "Courts, lawsuits, publicity, protest — demanding full rights.", "watch": "Time.", "move": "Connect to Plessy (Ch 8) and Brown v. Board.", "title": "Illinois: the riot that built the NAACP"}, {"t": 4, "say": "Accommodation or agitation? Both men wanted freedom; they disagreed about how.", "ask": "Whose strategy would you choose in 1905? Why?", "ans": "Either, with a reason tied to the dangers of the time.", "watch": "There's no 'right' answer here; grade the reasoning.", "move": "Model the assignment's quote analysis on one quote.", "title": "Be the Historian: Accommodation or Agitation?"}, {"t": 2, "say": "Unit 3 ends by insisting on the truth the comfortable story leaves out.", "ask": "Who was left out of the age of reform?", "ans": "Black Americans especially, but also immigrants and others.", "watch": "Time.", "move": "Bridge to next slide.", "title": "The Big Picture"}, {"t": 2, "say": "The Great Migration toward Chicago was just beginning. Back to the driving question.", "ask": "Who was left out, and how did they fight back? One sentence, one piece of evidence.", "ans": "'Black Americans were left out, and fought back through ___ like Ida B. Wells's ___.'", "watch": "Protect exit-ticket time.", "move": "Exit ticket in My Notes.", "title": "The Big Picture"}, {"t": 2, "say": "Read each word; students repeat.", "ask": "What does NAACP stand for?", "ans": "National Association for the Advancement of Colored People.", "watch": "Students may react to 'Colored' — explain it's the historical name.", "move": "EL: point to each word in the definition as you read it. Students who finish early add one picture or example per word in My Notes.", "title": "Vocabulary"}, {"t": 1, "say": "Don't teach this slide. Point to the assignment card and say: 'This is where you're going next.' Leave it up while you model the first item.", "ask": "", "ans": "", "watch": "Students click into a deep dive instead of the assignment. Tell them deep dives are for after the assignment or on choice day.", "move": "Write the assignment name on the board so students who get lost can find it from the hub.", "title": "Go deeper"}]}, "white-city/index.html": {"title": "The White City", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Chicago's 1893 World's Fair.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "The White City"}, {"t": 1, "say": "Three ideas to follow. Have students copy the three words into My Notes as headings.", "ask": "", "ans": "", "watch": "", "move": "These three headings become their notes for the whole deep dive.", "title": "Three ideas to follow"}, {"t": 2, "say": "Read the promise and the shadow together: what did the fair get right about the future, and what was it hiding?", "ask": "What question is this deep dive asking you to answer?", "ans": "Restate the question in their own words.", "watch": "Students skip the framing slide.", "move": "Point out the skill: this is what they'll be graded on in the claim.", "title": "Read the promise and the shadow together."}, {"t": 3, "say": "Burnham's White City: temporary white neoclassical palaces lit at night by electricity.", "ask": "Why build a 'city' that was meant to be torn down?", "ans": "To show the world what America and Chicago could become.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "A city of light"}, {"t": 3, "say": "What debuted here: the Ferris Wheel, electric light on a huge scale, new products.", "ask": "Which debut still affects your life?", "ans": "Electric power, the Ferris Wheel, foods and products first shown here.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "What debuted here"}, {"t": 3, "say": "The shadow: the Panic of 1893, unemployment, and who was shut out.", "ask": "Who wasn't welcome inside the fair's story?", "ans": "Black Americans (Douglass and Wells protested), workers, Native peoples shown as 'exhibits.'", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The shadow of the White City"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: weigh promise vs. reality.", "ask": "Was the fair progress or an illusion?", "ans": "Both, with evidence from each source.", "watch": "Students choose one side without using both sources.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Progress, or illusion?"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: point of view — the fair's story vs. the protesters'.", "ask": "Whose story did the fair tell, and who had to protest to be included?", "ans": "Its story celebrated white American progress; Douglass and Wells protested the exclusion of Black Americans.", "watch": "Students don't know Douglass and Wells protested; point to Source B.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Whose fair was it?"}, {"t": 8, "say": "Build a Deeper Claim: claim, evidence, reasoning, counter-claim. Model a weak claim and fix it out loud before releasing: 'The White City was bad' → 'The White City showed ___, because ___.'", "ask": "Is your claim something a reasonable person could disagree with?", "ans": "A claim that takes a side and can be argued, backed by evidence from the slides.", "watch": "Claims that are just facts ('The fair was in 1893'). A fact can't be argued.", "move": "Honors must complete the counter-claim box. Others: claim + one piece of evidence is the minimum.", "title": "What does the White City prove?"}, {"t": 1, "say": "Go deeper. Students who finish early can open another deep dive or a film.", "ask": "", "ans": "", "watch": "Students leave without saving. Work autosaves, but remind them to Download my work if they switch devices.", "move": "", "title": "Go deeper"}]}, "haymarket/index.html": {"title": "The Haymarket Affair", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Haymarket, May 1886 — the same event as Chapter 6, in depth.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "The Haymarket Affair"}, {"t": 1, "say": "Three ideas to follow. Have students copy the three words into My Notes as headings.", "ask": "", "ans": "", "watch": "", "move": "These three headings become their notes for the whole deep dive.", "title": "Three ideas to follow"}, {"t": 2, "say": "Separate what can be proven from what people believed. This is the PROVEN | NOT PROVEN | OPINION skill from Chapter 6.", "ask": "What question is this deep dive asking you to answer?", "ans": "Restate the question in their own words.", "watch": "Students skip the framing slide.", "move": "Point out the skill: this is what they'll be graded on in the claim.", "title": "“Who threw the bomb?”"}, {"t": 3, "say": "The eight-hour day: 'eight hours for work, eight for rest, eight for what we will.'", "ask": "Why was an eight-hour day such a big demand?", "ans": "Workers worked 10–14 hours; it meant time for family, rest, and life.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The eight-hour day"}, {"t": 3, "say": "The bomb: a small, peaceful rally; the mayor watched and went home; police marched in; someone threw a bomb.", "ask": "What detail suggests the rally was peaceful?", "ans": "The mayor watched and left; it was winding down in the rain.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The bomb"}, {"t": 3, "say": "The trial: the prosecution admitted it couldn't prove who threw the bomb, and argued the speeches caused it.", "ask": "What were the men really convicted for?", "ans": "Their words and beliefs, not the act.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The trial"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: how far does the evidence reach?", "ask": "Who threw the bomb?", "ans": "Unknown — the evidence doesn't reach any defendant.", "watch": "Students name a defendant as the bomber.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Who threw the bomb?"}, {"t": 6, "say": "Lab slide. Students read Source A and Source B, then write. Don't read the sources to them — circulate. Skill: crime or idea?", "ask": "Were the men tried for a crime or for their ideas?", "ans": "For their ideas, with evidence (no link to the bomb; Altgeld's 1893 pardon).", "watch": "Students accept 'they called for violence' as proof of the act.", "move": "Partner read, solo write. EL: point to the sentence starter under the box. Answers autosave.", "title": "Crime, or idea?"}, {"t": 8, "say": "Build a Deeper Claim: claim, evidence, reasoning, counter-claim. Model a weak claim and fix it out loud before releasing: 'The Haymarket trial was bad' → 'The Haymarket trial showed ___, because ___.'", "ask": "Is your claim something a reasonable person could disagree with?", "ans": "A claim that takes a side and can be argued, backed by evidence from the slides.", "watch": "Claims that are just facts ('The fair was in 1893'). A fact can't be argued.", "move": "Honors must complete the counter-claim box. Others: claim + one piece of evidence is the minimum.", "title": "What does Haymarket prove?"}, {"t": 1, "say": "Go deeper. Students who finish early can open another deep dive or a film.", "ask": "", "ans": "", "watch": "Students leave without saving. Work autosaves, but remind them to Download my work if they switch devices.", "move": "", "title": "Go deeper"}]}, "movers-shakers/index.html": {"title": "Movers & Shakers of Illinois", "slides": [{"t": 2, "say": "Cover. Read the opening and the driving question aloud. Illinois figures who shaped the age.", "ask": "What do you predict the answer will be?", "ans": "Any prediction — they'll test it.", "watch": "Students click ahead to the end. Tell them the labs need the middle slides.", "move": "Pairs work through at their own pace; you circulate.", "title": "Movers & Shakers of Illinois"}, {"t": 1, "say": "Three ideas to follow. Have students copy the three words into My Notes as headings.", "ask": "", "ans": "", "watch": "", "move": "These three headings become their notes for the whole deep dive.", "title": "Three ideas to follow"}, {"t": 2, "say": "Ask of each person: what did they change, who paid for it, and has history judged them fairly?", "ask": "What question is this deep dive asking you to answer?", "ans": "Restate the question in their own words.", "watch": "Students skip the framing slide.", "move": "Point out the skill: this is what they'll be graded on in the claim.", "title": "Four kinds of mover."}, {"t": 3, "say": "The Bosses: Pullman, Field, Armour, Rosenwald.", "ask": "Which boss did the most good? Which did the most harm?", "ans": "Rosenwald (schools for Black children) often named for good; Pullman for harm. Any with a reason.", "watch": "Students skim. Ask them to highlight one fact per slide.", "move": "Read aloud is available for students who need it.", "title": "The Bosses"}, {"t": 3, "say": "The Reformers: Addams, Kelley, Willard, Wells.", "ask": "What did the reformers have in common?", "ans": "They worked on problems the bosses created or ignored.", "watc
